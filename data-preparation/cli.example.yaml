# Shared by all walkthroughs. Store API keys in the referenced environment variables.
providers:
  local:
    type: openai
    base_url: http://127.0.0.1:8081/v1
    model: assistance
    timeout: 5m
    max_output_tokens: 8192
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    model: SET_MODEL
    api_key_env: OPENAI_API_KEY
    timeout: 5m
    max_output_tokens: 8192
  claude:
    type: anthropic
    base_url: https://api.anthropic.com/v1
    model: SET_MODEL
    api_key_env: ANTHROPIC_API_KEY
    timeout: 5m
    max_output_tokens: 8192
  local-embeddings:
    type: openai
    base_url: http://127.0.0.1:8081/v1
    model: embedding
    version: "1"
    dimensions: 768
    timeout: 2m
