name: walkthrough-langfuse
x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run setup.py}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:1488
  SALT: ${SALT:?run setup.py}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run setup.py}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run setup.py}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run setup.py}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run setup.py}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run setup.py}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://objectstore:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
x-dependencies: &dependencies
  postgres: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  redis: {condition: service_healthy}
  objectstore: {condition: service_healthy}
services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.75.0
    restart: unless-stopped
    depends_on: *dependencies
    ports: ["127.0.0.1:1488:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    environment:
      <<: *app-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run setup.py}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://objectstore:9000
      LANGFUSE_INIT_ORG_ID: walkthrough
      LANGFUSE_INIT_ORG_NAME: Walkthrough Assistance
      LANGFUSE_INIT_PROJECT_ID: walkthrough-backend
      LANGFUSE_INIT_PROJECT_NAME: Backend evaluation
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?run setup.py}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?run setup.py}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_EMAIL:?run setup.py}
      LANGFUSE_INIT_USER_NAME: Local developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_PASSWORD:?run setup.py}
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.75.0
    restart: unless-stopped
    depends_on: *dependencies
    environment: *app-env
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.py}
      POSTGRES_DB: langfuse
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run setup.py}
      CLICKHOUSE_DB: default
    volumes: [clickhouse-data:/var/lib/clickhouse, clickhouse-logs:/var/log/clickhouse-server]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    restart: unless-stopped
    command: [redis-server, --requirepass, "${REDIS_AUTH:?run setup.py}", --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_AUTH redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?run setup.py}
  objectstore:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: [mini, -dir=/data, -s3.port=9000]
    environment:
      AWS_ACCESS_KEY_ID: langfuse
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run setup.py}
      S3_BUCKET: langfuse
    ports: ["127.0.0.1:9090:9000"]
    volumes: [objectstore-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
  objectstore-data:
